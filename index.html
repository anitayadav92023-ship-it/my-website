<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
</head>
<body>

    <h1>Welcome to My Website</h1>
    <p>यह मेरी पहली वेबसाइट है!</p>

    <hr>
    <h3>हमसे जुड़ें</h3>
    <form action="">
        <label for="username">आपका नाम:</label><br>
        <input type="text" id="username" name="username" placeholder="यहाँ अपना नाम लिखें"><br><br>

        <label for="message">आपका संदेश:</label><br>
        <textarea id="message" name="message" placeholder="कुछ भी लिखें..."></textarea><br><br>

        <input type="submit" value="जमा करें">
    </form>

</body>
</html>
