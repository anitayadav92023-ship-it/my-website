<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        body {
            background-color: #e0f7fa; /* हल्का नीला बैकग्राउंड */
            font-family: Arial, sans-serif; /* सुंदर लिखावट */
            padding: 20px;
        }
        form {
            background-color: white; /* फॉर्म का बैकग्राउंड सफेद */
            padding: 20px;
            border-radius: 8px; /* गोल कोने */
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1); /* हल्की परछाई */
            max-width: 300px;
        }
        input[type="submit"] {
            background-color: #007bff; /* नीला बटन */
            color: white; /* सफेद अक्षर */
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>
    <p>यह मेरी पहली वेबसाइट है!</p>

    <hr>
    <h3>हमसे जुड़ें</h3>
    <form action="">
        <label for="username">आपका नाम:</label><br>
        <input type="text" id="username" name="username" placeholder="यहाँ अपना नाम लिखें"><br><br>

        <label for="message">आपका संदेश:</label><br>
        <textarea id="message" name="message" placeholder="कुछ भी लिखें..."></textarea><br><br>

        <input type="submit" value="जमा करें">
    </form>

</body>
</html>
