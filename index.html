 <!DOCTYPE html>
<html>
<head>
    <title>My Website</title>
    <style>
        body {
            background-color: #e0f7fa; /* हल्का नीला बैकग्राउंड */
            font-family: Arial, sans-serif; /* सुंदर लिखावट */
            padding: 20px;
        }
        form {
            background-color: white; /* फॉर्म का बैकग्राउंड सफेद */
            padding: 20px;
            border-radius: 8px; /* गोल कोने */
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1); /* हल्की परछाई */
            max-width: 300px;
        }
        input[type="text"], input[type="email"], input[type="password"], textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            background-color: #007bff; /* नीला बटन */
            color: white; /* सफेद अक्षर */
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>
    <p>यह मेरी पहली वेबसाइट है!</p>

    <hr>
    <h3>लॉगिन / हमसे जुड़ें</h3>
    <form action="">
        <label for="username">आपका नाम:</label>
        <input type="text" id="username" name="username" placeholder="यहाँ अपना नाम लिखें" required>

        <label for="email">आपका ईमेल:</label>
        <input type="email" id="email" name="email" placeholder="name@email.com" required>

        <label for="password">पासवर्ड:</label>
        <input type="password" id="password" name="password" placeholder="अपना पासवर्ड डालें" required>

        <label for="message">आपका संदेश:</label>
        <textarea id="message" name="message" placeholder="कुछ भी लिखें..."></textarea>

        <input type="submit" value="जमा करें">
    </form>

</body>
</html>
